# Temporary HTTP-only config used only to obtain the first Let's Encrypt certificate.
server {
    listen 80;
    listen [::]:80;
    server_name codex.alazab.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Do not expose the login or WebSocket over plaintext HTTP.
    location / {
        return 404;
    }
}
